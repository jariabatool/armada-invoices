# Render Blueprint for the backend API: https://render.com/docs/blueprint-spec
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: armada-invoices-api
    runtime: node
    plan: free
    rootDir: backend
    # --include=dev: TypeScript and the Prisma CLI are dev dependencies needed to build
    buildCommand: npm ci --include=dev && npm run db:deploy && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: OVERDUE_CRON
        value: "0 * * * *"
