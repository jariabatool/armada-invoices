# Netlify config for the backend API (set Base directory to "backend" in Netlify).
# The Express app runs as a serverless function; the overdue job runs as a scheduled function.
[build]
  # Apply database migrations, then type-check and compile
  command = "npm run db:deploy && npm run build"
  # Static output is unused: every request is rewritten to the API function below
  publish = "netlify/static"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true
