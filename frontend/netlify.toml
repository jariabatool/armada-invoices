# Netlify config for the frontend (set Base directory to "frontend" in Netlify).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: serve index.html for every route so refreshes on /invoices etc. work
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
